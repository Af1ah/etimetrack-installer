name: Installer checks
on:
  push:
  pull_request:
jobs:
  offline-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell offline checks
        shell: powershell
        run: ./tests/Test-Installer.ps1
      - name: Verify payload and build installer ZIP
        shell: pwsh
        run: python ./build/package.py
